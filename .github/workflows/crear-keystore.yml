name: Crear keystore de firma

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar keystore y datos de la firma
        run: |
          mkdir -p salida
          PASS="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)"
          ALIAS="upload"

          keytool -genkeypair -v \
            -keystore salida/upload.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Juan Manuel Vazquez, OU=Calculadora de Fertilizacion, L=Lujan, ST=Buenos Aires, C=AR" \
            > /dev/null 2>&1

          base64 -w 0 salida/upload.jks > salida/KEYSTORE_BASE64.txt

          {
            echo "=== SECRETOS PARA GITHUB ==="
            echo "Cargalos en: Settings > Secrets and variables > Actions"
            echo ""
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_ALIAS         = $ALIAS"
            echo "KEY_PASSWORD      = $PASS"
            echo ""
            echo "KEYSTORE_BASE64   = (todo el contenido de KEYSTORE_BASE64.txt)"
            echo ""
            echo "=== IMPORTANTE ==="
            echo "Guarda upload.jks y esta contrasena en un lugar seguro."
            echo "Si los perdes, no podes firmar actualizaciones de la app"
            echo "sin pedirle a Google un restablecimiento de la clave."
          } > salida/LEEME_secretos.txt

          echo "Listo. Los datos estan en el artifact, no en este log."

      - name: Publicar el keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-firma-PRIVADO
          path: salida/
          retention-days: 1
          if-no-files-found: error
