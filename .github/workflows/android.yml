name: Compilar app Android (APK y AAB)

# Se ejecuta a mano desde la pestaña Actions ("Run workflow"), cuando se
# quiere sacar una versión nueva para Google Play.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Copiar la app web dentro del paquete Android
        run: |
          D=app/src/main/assets
          rm -rf "$D" && mkdir -p "$D"
          cp ../index.html ../manifest.webmanifest ../precios.json "$D"/
          cp -r ../css ../js ../iconos "$D"/
          ls -R "$D"

      - name: Leer la versión de la app web
        id: version
        run: echo "nombre=$(grep -oP 'const VERSION = "\K[^"]+' ../js/app.js)" >> "$GITHUB_OUTPUT"

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar keystore de firma
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
            echo "Keystore restaurado."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Sin KEYSTORE_BASE64: se omite la firma del AAB."
          fi

      - name: Compilar APK de prueba (para instalar a mano)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.nombre }}
        run: gradle assembleDebug --no-daemon

      - name: Compilar AAB de release (para Google Play)
        if: steps.keystore.outputs.path != ''
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.nombre }}
        run: gradle bundleRelease --no-daemon

      - name: Publicar el APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-fertilizacion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar el AAB firmado
        if: steps.keystore.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-fertilizacion-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Borrar el keystore del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
